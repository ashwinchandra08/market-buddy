name: render-dashboard

on:
  schedule:
    - cron: "5,35 * * * 1-5"   # weekdays: every 30 min (UTC)
    - cron: "5 */3 * * 0,6"    # weekends: every 3 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - uses: actions/cache@v4
        with:
          path: sprites
          key: sprites-v1
      - run: pip install -r requirements.txt
      - name: Render
        env:
          # previous run's cache.json from Pages = last-good-values fallback
          CACHE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/cache.json
        run: python -m src.main --out site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
